openapi: 3.0.3
info:
  title: Smart Customer REST API - Rancangan
  version: 1.0.0
  description: |
    Rancangan REST API konseptual untuk Smart Customer.
    Implementasi saat ini menggunakan Firebase SDK dan Cloud Firestore;
    Python CV menulis melalui Firebase Admin SDK.
servers:
  - url: https://api.example.com/v1
security:
  - firebaseBearer: []
components:
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID Token
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: FORBIDDEN
            message:
              type: string
              example: Role pengguna tidak memiliki izin untuk operasi ini.
            requestId:
              type: string
              example: req_123456
    UserProfile:
      type: object
      required: [uid, role]
      properties:
        uid:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, operator, viewer]
    CurrentVisitorState:
      type: object
      required:
        - cameraId
        - jumlahDiDalam
        - totalMasuk
        - totalKeluar
        - maxCapacity
        - sensorOnline
        - timestamp
      properties:
        cameraId:
          type: string
        jumlahDiDalam:
          type: integer
          minimum: 0
        totalMasuk:
          type: integer
          minimum: 0
        totalKeluar:
          type: integer
          minimum: 0
        maxCapacity:
          type: integer
          minimum: 1
        sensorOnline:
          type: boolean
        statusKepadatan:
          type: string
          enum: [SEPI, NORMAL, RAMAI, SANGAT RAMAI]
        persentaseKapasitas:
          type: integer
          minimum: 0
          maximum: 100
        timestamp:
          type: string
          format: date-time
        dataSource:
          type: string
          enum: [firestore]
        isStale:
          type: boolean
    HistoryItem:
      type: object
      required: [snapshotId, timestamp, jumlahDiDalam, densityStatus]
      properties:
        snapshotId:
          type: string
        timestamp:
          type: string
          format: date-time
        jumlahDiDalam:
          type: integer
          minimum: 0
        densityStatus:
          type: string
          enum: [SEPI, NORMAL, RAMAI, SANGAT RAMAI]
    HistoryResponse:
      type: object
      required: [cameraId, items, pagination]
      properties:
        cameraId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/HistoryItem'
        pagination:
          type: object
          required: [limit]
          properties:
            limit:
              type: integer
              minimum: 1
              maximum: 500
            nextCursor:
              type: string
              nullable: true
    AnalyticsSummary:
      type: object
      required:
        - cameraId
        - period
        - averageVisitors
        - busiestHour
        - highestVisitors
        - lowestVisitors
        - sampleCount
      properties:
        cameraId:
          type: string
        period:
          type: object
          required: [from, to]
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
        averageVisitors:
          type: integer
          minimum: 0
        busiestHour:
          type: string
          example: "09:00 - 10:00"
        highestVisitors:
          type: integer
          minimum: 0
        lowestVisitors:
          type: integer
          minimum: 0
        sampleCount:
          type: integer
          minimum: 0
    CvPublishPayload:
      type: object
      required:
        - cameraId
        - jumlahDiDalam
        - totalMasuk
        - totalKeluar
        - maxCapacity
        - sensorOnline
      properties:
        cameraId:
          type: string
          minLength: 1
        jumlahDiDalam:
          type: integer
          minimum: 0
        totalMasuk:
          type: integer
          minimum: 0
        totalKeluar:
          type: integer
          minimum: 0
        maxCapacity:
          type: integer
          minimum: 1
        sensorOnline:
          type: boolean
        forceSnapshot:
          type: boolean
          default: false
        publishedAt:
          type: string
          format: date-time
    CameraConfig:
      type: object
      required: [cameraId, maxCapacity, alertThreshold]
      properties:
        cameraId:
          type: string
        maxCapacity:
          type: integer
          minimum: 1
        alertThreshold:
          type: integer
          minimum: 1
paths:
  /users/me:
    get:
      summary: Mendapatkan profil pengguna
      responses:
        "200":
          description: Profil berhasil diperoleh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        "401":
          description: Token tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /cameras:
    get:
      summary: Mendapatkan daftar kamera
      responses:
        "200":
          description: Daftar kamera
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [cameraId, name]
                  properties:
                    cameraId:
                      type: string
                    name:
                      type: string
                    active:
                      type: boolean
  /cameras/{cameraId}/current:
    get:
      summary: Mendapatkan kondisi pengunjung terkini
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Kondisi terkini
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentVisitorState'
        "404":
          description: Kamera tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "503":
          description: Firestore atau kamera tidak tersedia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /cameras/{cameraId}/history:
    get:
      summary: Mendapatkan riwayat snapshot
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 500
            minimum: 1
            maximum: 500
        - name: start
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Daftar snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
  /cameras/{cameraId}/analytics/summary:
    get:
      summary: Mendapatkan ringkasan analitik
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ringkasan analitik
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummary'
  /cameras/{cameraId}/config:
    get:
      summary: Mendapatkan konfigurasi kamera
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Konfigurasi kamera
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraConfig'
    patch:
      summary: Mengubah konfigurasi kamera
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                maxCapacity:
                  type: integer
                  minimum: 1
                alertThreshold:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Konfigurasi diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraConfig'
        "403":
          description: Role bukan admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /cv/cameras/{cameraId}/publish:
    post:
      summary: Menerima agregat pengunjung dari proses CV
      security:
        - firebaseBearer: []
      parameters:
        - name: cameraId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CvPublishPayload'
      responses:
        "201":
          description: Kondisi CV berhasil dipublikasikan
          content:
            application/json:
              schema:
                type: object
                required: [cameraId, published]
                properties:
                  cameraId:
                    type: string
                  published:
                    type: boolean
        "400":
          description: Payload tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
